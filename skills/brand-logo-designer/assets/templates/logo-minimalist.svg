  <polygon points="160,320 260,100 340,200 400,130 480,320" fill="url(#gm)" stroke="#C9A96E" stroke-width="1.8" stroke-linejoin="round"/>
  <polyline points="220,320 290,160 340,240 380,170 450,320" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.35" stroke-dasharray="3,5"/>
